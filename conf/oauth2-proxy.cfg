http_address          = "127.0.0.1:4180"
provider              = "oidc"
provider_display_name = "Forgejo"
oidc_issuer_url       = "http://git.test"
client_id             = "CHANGE_ME"
client_secret         = "CHANGE_ME"
proxy_prefix          = "/_oauth2"
redirect_url          = "http://pages.test:3001/_oauth2/callback"
scope                 = "openid email profile read:repository read:user"
email_domains         = ["*"]
cookie_name           = "_pages"           # prod: "__Host-pages" (needs HTTPS)
cookie_secret         = "CHANGE_ME"
cookie_secure         = false              # prod: true
cookie_samesite       = "lax"
cookie_refresh        = "50m"
pass_access_token     = true               # needed for X-Auth-Request-Access-Token
set_xauthrequest      = true               # /_oauth2/auth returns user, email and token headers
reverse_proxy         = true
skip_provider_button  = true
upstreams             = ["static://202"]
