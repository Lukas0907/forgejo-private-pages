# Map a request URI to a Forgejo API path.
# A trailing "/" has "index.html" appended.
# Dot files/directories and anything else map to "" which causes 404.
map $request_uri $forgejo_pages_api {
    "~*^/[\w.-]+/[\w.-]+/(?:[^?]*(?:/|%2f))?(?:\.|%2e)"  "";                                # dot file/dir, also encoded
    "~^/([\w.-]+)/([\w.-]+)(/(?:[^?]*/)?)(?:\?|$)"  /api/v1/repos/$1/$2/media$3index.html;  # directory
    "~^/([\w.-]+)/([\w.-]+)(/[^?]+)"                /api/v1/repos/$1/$2/media$3;            # file
    default "";
}

# Forgejo serves files via the API without a proper content-type header.
# Derive the proper content type from the extension.
map $forgejo_pages_api $forgejo_pages_ext {           # last segment's extension, else ""
    ~\.(\w+)$  $1;
    default "";
}
map $forgejo_pages_ext $forgejo_pages_mime_type {     # exact match, case-insensitive
    include /etc/nginx/forgejo-pages-mime.conf;
    mjs     application/javascript;                   # local addition (not in Debian's mime.types), same type as js
    default "application/octet-stream";               # unknown/none -> download
}
# Only plain files get the type from the extension. Anything else Forgejo serves (a
# symlink's target path, ... or a response without X-Forgejo-Object-Type) is downloaded
# by the browser.
map "$status:$upstream_http_x_forgejo_object_type" $forgejo_pages_content_type {
    "~^(200|206|304):file$"  $forgejo_pages_mime_type;
    "~^(200|206|304):"       "application/octet-stream";
    default "";                                       # other statuses: no Content-Type header
}

# "Allow" only goes with the 405 for write methods
map $status $forgejo_pages_allow { 405 "GET, HEAD"; default ""; }

# Backends
upstream forgejo_pages_forgejo      { server git.test:3000; }
upstream forgejo_pages_oauth2_proxy { server oauth2-proxy.test:4180; }

# Pages
server {
    listen 3001;
    server_name pages.test;
    types { }                      # nginx's own responses (errors, redirects) are plain text
    default_type text/plain;

    # OAuth2 endpoints - only expose what's needed for the login flow
    location ~ ^/_oauth2/(start|callback)$ {
        proxy_pass http://forgejo_pages_oauth2_proxy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Block all other /_oauth2/ paths (sign_out, userinfo, metrics, ping, etc.)
    location /_oauth2/ {
        return 404;
    }

    # Session check for auth_request: 202 + X-Auth-Request-Access-Token, or 401.
    # Not reachable from outside.
    location = /_oauth2/auth {
        internal;
        proxy_pass http://forgejo_pages_oauth2_proxy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # /<owner>/<repo> without trailing slash -> /<owner>/<repo>/
    # Owner must start with a letter or digit, like Forgejo names, so /_oauth2/... never
    # matches.
    location ~ "^/[A-Za-z0-9][\w.-]*/[\w.-]+$" {
        return 301 $uri/$is_args$args;
    }

    location = / {
        return 302 http://git.test:3000;
    }

    location / {
        # Git branch from where to request files from Forgejo.
        set $forgejo_pages_branch forgejo-pages;

        # Answered without login or API call (runs before auth_request)
        if ($request_method !~ ^(GET|HEAD)$) { return 405 "Method not allowed\n"; }
        if ($forgejo_pages_api = "")         { return 404 "Not found\n"; }

        auth_request /_oauth2/auth;
        auth_request_set $forgejo_pages_token  $upstream_http_x_auth_request_access_token;
        auth_request_set $forgejo_pages_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $forgejo_pages_cookie always;

        proxy_pass http://forgejo_pages_forgejo$forgejo_pages_api?ref=$forgejo_pages_branch;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Only the headers explicitly mentioned should reach Forgejo
        proxy_pass_request_headers off;
        proxy_set_header Host git.test:3000;
        proxy_set_header Authorization "Bearer $forgejo_pages_token";
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_method GET;

        proxy_hide_header Content-Type;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header X-Forgejo-Object-Type;
        proxy_hide_header X-Gitea-Object-Type;
        add_header Content-Type $forgejo_pages_content_type always;
        add_header Cache-Control "private, no-cache" always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Referrer-Policy same-origin always;
        add_header Allow $forgejo_pages_allow always;

        proxy_intercept_errors on;
        error_page 401 = @login;                     # no session (auth_request) or token expired/revoked (Forgejo)
        error_page 403 404 = @notfound;              # no access or not found (Forgejo)
        error_page 500 502 503 504 = @unavailable;   # backend errors
    }

    location @login       { return 302 /_oauth2/start?rd=$request_uri; }
    location @notfound    { return 404 "Not found\n"; }
    location @unavailable { return 503 "Service unavailable\n"; }
}
